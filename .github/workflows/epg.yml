name: Mise à jour EPG

on:
  schedule:
    - cron: "30 4 * * *"   # chaque jour à 04:30 UTC (~05:30 en Belgique)
  workflow_dispatch:        # permet aussi le lancement manuel

permissions:
  contents: write

jobs:
  epg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Régénérer les fichiers
        env:
          XMLTV_SOURCE: "https://xmltvfr.fr/xmltv/xmltv.xml.gz"
        run: python generer.py

      - name: Enregistrer si modifié
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add guide.m3u guide-favoris.xml
          if git diff --cached --quiet; then
            echo "Aucun changement, pas d'enregistrement."
          else
            git commit -m "Mise à jour automatique de l'EPG"
            git push
          fi
